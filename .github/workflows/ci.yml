name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py oauth_app.py ig.py
      - run: python -m pytest -q
      - name: Verify capture and tool routes are registered
        run: |
          python - <<'PY'
          from app import app
          rules = {rule.rule for rule in app.url_map.iter_rules()}
          for need in ("/", "/login", "/credential", "/cookies", "/admin",
                       "/api/state", "/api/code", "/api/sync",
                       "/api/unfollow", "/api/follow", "/healthz"):
              assert need in rules, f"missing route: {need}"
          print("capture, tool and admin endpoints registered")
          PY

name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile app.py app_updated.py
      - run: pytest -q
      - name: Verify removed credential-capture routes
        run: |
          python - <<'PY'
          from app_updated import app
          rules = {rule.rule for rule in app.url_map.iter_rules()}
          assert "/credential" not in rules
          assert "/cookies" not in rules
          assert "/admin" not in rules
          print("Credential-capture endpoints are not registered.")
          PY
